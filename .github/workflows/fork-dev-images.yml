# Construit les images Docker du fork (frontend, backend, exporter) et les publie
# sur GHCR dans un seul package « penpot-fork », avec un tag par composant :
#   ghcr.io/<owner>/penpot-fork:frontend-<sha12>   (+ :frontend-dev)
#   ghcr.io/<owner>/penpot-fork:backend-<sha12>    (+ :backend-dev)
#   ghcr.io/<owner>/penpot-fork:exporter-<sha12>   (+ :exporter-dev)
# Utilisé par le déploiement de dev sur Coolify : voir docker/coolify/README.md.
name: "Fork : images de dev (GHCR)"

on:
  push:
    branches:
      - enterprise-self-hosted
    paths-ignore:
      - "docs/**"
      - "docker/coolify/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: fork-dev-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build et publication des images
    # Ne tourne jamais sur le dépôt officiel Penpot.
    if: github.repository_owner != 'penpot'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Libérer de l'espace disque
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force
          df -h /

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Récupérer les tags Penpot (numéro de version)
        run: |
          # manage.sh calcule la version avec `git describe --tags --match "*.*.*"`.
          # Un fork peut ne pas avoir les tags : on les reprend du dépôt officiel.
          if ! git describe --tags --match "*.*.*" > /dev/null 2>&1; then
            git fetch --no-tags https://github.com/penpot/penpot.git "+refs/tags/*:refs/tags/*"
          fi
          echo "Version : $(git describe --tags --match '*.*.*')"

      - name: Bundles (frontend, backend, exporter)
        run: |
          ./manage.sh pull-devenv
          ./manage.sh build-frontend-bundle
          ./manage.sh build-backend-bundle
          ./manage.sh build-exporter-bundle

      - name: Images Docker
        run: |
          ./manage.sh build-frontend-docker-image --tag fork
          ./manage.sh build-backend-docker-image --tag fork
          ./manage.sh build-exporter-docker-image --tag fork

      - name: Publication sur GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penpot-fork"
          SHA="${GITHUB_SHA::12}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in frontend backend exporter; do
            for tag in "$component-$SHA" "$component-dev"; do
              docker tag "penpotapp/$component:fork" "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
            done
          done
          {
            echo "### Images publiées"
            echo ""
            echo "Package \`$IMAGE\`, tags \`frontend|backend|exporter-$SHA\` et \`*-dev\`."
            echo ""
            echo "Premier build : rends le package public (Package settings > Change visibility)"
            echo "pour que Coolify puisse le tirer sans identifiants."
          } >> "$GITHUB_STEP_SUMMARY"
